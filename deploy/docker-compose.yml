version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litradar
      POSTGRES_USER: litradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema is created by the app's tracked migration runner on startup (single source
      # of truth). Do NOT mount deploy/migration.sql here (would fork the schema).
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U litradar -d litradar']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://litradar:${POSTGRES_PASSWORD}@db:5432/litradar
      # MUST be a long random string; the app refuses to boot in production otherwise.
      - JWT_SECRET=${JWT_SECRET:?set a long random JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - NODE_ENV=production
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
